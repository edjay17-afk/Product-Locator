version: '3.8'

services:
  product-locator:
    build: .
    ports:
      - "3002:3002"
    volumes:
      - ./db:/usr/src/app/db
    restart: always
    environment:
      - PORT=3002
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN}
