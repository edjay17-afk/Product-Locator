[build]
  command = "npm run build"
  publish = "public"
  functions = "functions"

[functions]
  included_files = ["db/**"]
  node_bundler = "esbuild"

[functions."api"]
  timeout = 26

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
